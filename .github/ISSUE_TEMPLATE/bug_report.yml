name: Bug report / 缺陷报告
description: Report a reproducible problem using synthetic data.
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser and Node.js version. Do not include private server addresses.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic prompts, accounts and files. No credentials or real conversations.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
